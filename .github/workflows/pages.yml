name: Pages

# Builds the web app and publishes it to GitHub Pages, at https://amirehsank.github.io/Loadline/.
#
# It runs when started by hand (Actions, Pages, Run workflow; or `gh workflow run pages.yml`), so
# what is live changes when somebody decides it should. To publish every commit instead, add
# `push: { branches: [main] }` here. Pages is switched on for the repository with GitHub Actions
# as its source; without that, this workflow fails at its last step.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and one that has started is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Nothing is published that does not pass the checks.
      - run: npm run check
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
